<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dynamic QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1c1f2a; --muted:#6a7080; --accent:#2563eb; --border:#e2e5ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12141b; --card:#1b1e28; --text:#eceef4; --muted:#9aa1b5; --accent:#6b9bff; --border:#2c3040; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; line-height:1.5; }
    main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
    h1 { font-size:1.5rem; margin:8px 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
    h2 { font-size:1.05rem; margin:0 0 12px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
    input[type=text], input[type=url], textarea {
      width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
      background:var(--bg); color:var(--text); font:inherit;
    }
    textarea { font-family:ui-monospace,monospace; font-size:.85rem; min-height:70px; }
    button {
      background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 14px;
      font:inherit; cursor:pointer; margin-top:12px;
    }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); margin-left:6px; }
    #qrBox { display:flex; justify-content:center; padding:12px; background:#fff; border-radius:12px; margin-top:12px; }
    #qrBox img, #qrBox canvas { max-width:100%; height:auto; }
    .hint { font-size:.85rem; color:var(--muted); margin-top:8px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
    .row:first-child { border-top:0; }
    .row .u { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.85rem; color:var(--muted); }
    .row b { display:block; }
    .row button { margin:0; padding:6px 10px; }
    .hidden { display:none; }
    code { word-break:break-all; }
  </style>
</head>
<body>
<main>
  <h1>My Dynamic QR</h1>
  <p class="sub">Free QR codes whose destination you can change later, without reprinting.</p>

  <div class="card">
    <h2>1. Make a new QR</h2>
    <label for="dest">Where should it go? (full link)</label>
    <input id="dest" type="url" placeholder="https://g.page/r/your-review-link/review">
    <label for="code">Short name (optional, letters/numbers only)</label>
    <input id="code" type="text" placeholder="review" maxlength="30" autocapitalize="none">
    <button id="make">Make QR</button>

    <div id="result" class="hidden">
      <div id="qrBox"></div>
      <p class="hint">QR points to: <code id="shortUrl"></code></p>
      <button id="download">Download PNG</button>
      <label for="snippet" style="margin-top:16px">Add this line inside links.json on GitHub, then save:</label>
      <textarea id="snippet" readonly></textarea>
      <button id="copy" class="ghost" style="margin-left:0">Copy line</button>
      <p class="hint">The QR only works after this line is saved in links.json. To change the destination later, edit that same line.</p>
    </div>
  </div>

  <div class="card">
    <h2>2. Your saved links</h2>
    <div id="list"><p class="hint">Loading...</p></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');

  function shortUrlFor(code) { return base + 'go.html?c=' + encodeURIComponent(code); }

  function drawQR(text) {
    const box = $('qrBox');
    box.innerHTML = '';
    new QRCode(box, { text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  }

  function randomCode() {
    return Math.random().toString(36).slice(2, 8);
  }

  function showResult(code, dest) {
    const url = shortUrlFor(code);
    drawQR(url);
    $('shortUrl').textContent = url;
    $('snippet').value = JSON.stringify(code) + ': ' + JSON.stringify(dest || 'https://example.com') + ',';
    $('result').classList.remove('hidden');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  $('make').addEventListener('click', () => {
    const dest = $('dest').value.trim();
    if (!/^https?:\/\//i.test(dest)) { alert('Enter a full link starting with http:// or https://'); return; }
    let code = $('code').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!code) code = randomCode();
    $('code').value = code;
    showResult(code, dest);
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('snippet').value); $('copy').textContent = 'Copied'; }
    catch (e) { $('snippet').select(); }
  });

  $('download').addEventListener('click', () => {
    const canvas = $('qrBox').querySelector('canvas');
    const img = $('qrBox').querySelector('img');
    const a = document.createElement('a');
    a.href = canvas ? canvas.toDataURL('image/png') : img.src;
    a.download = ($('code').value || 'qr') + '.png';
    a.click();
  });

  async function loadList() {
    const list = $('list');
    try {
      const res = await fetch('links.json', { cache: 'no-store' });
      const links = await res.json();
      const codes = Object.keys(links);
      if (!codes.length) { list.innerHTML = '<p class="hint">No links yet.</p>'; return; }
      list.innerHTML = '';
      codes.forEach((code) => {
        const row = document.createElement('div');
        row.className = 'row';
        const info = document.createElement('div');
        info.style.minWidth = '0';
        const b = document.createElement('b'); b.textContent = code;
        const u = document.createElement('div'); u.className = 'u'; u.textContent = links[code];
        info.append(b, u);
        const btn = document.createElement('button');
        btn.textContent = 'Show QR';
        btn.addEventListener('click', () => { $('code').value = code; $('dest').value = links[code]; showResult(code, links[code]); });
        row.append(info, btn);
        list.append(row);
      });
    } catch (e) {
      list.innerHTML = '<p class="hint">Could not load links.json (open this page from your hosted site, not as a local file).</p>';
    }
  }
  loadList();
</script>
</body>
</html>
